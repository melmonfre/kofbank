# Pix institutional configuration.
#
# Values here are institution-side operating settings.  Where a value is
# commonly believed to be fixed by Banco Central do Brasil rules (devolution
# window, MED deadlines, key limits, amount caps), it is NOT asserted here as
# regulatory truth.  It must be validated against the current authoritative
# sources before production use:
#   - Pix Regulation Book (Manual de Regras e Procedimentos do Pix), BCB
#   - SPI / DICT technical specifications, BCB
#   - QR Code Pix specification (EMVCo MPM based), BCB
# Keep behaviour driven by this file so the core is not structurally bound to
# one version of an external specification.

enabled=Y
rail=PIX
self-participant=P00000000001
base-currency=BRL
adapter=FIXTURE
# adapter=FIXTURE is a deterministic LOCAL test double for SPI/DICT answers.
# It is NOT a Banco Central integration. Set adapter=NONE to refuse any
# operation that requires the external boundary.
simulate=NONE
e2e-ispb=12345678
max-amount=9999999999999.99
keys-per-account=5
qr-ttl-minutes=60
devolution-window-days=7
med-window-days=11
stale-days=1
expire-days=1
# Settlement cycle operating settings.  The real SPI settlement schedule and
# participant obligations are external/regulatory; lag and account mapping are
# institution-side configuration so no Banco Central window is hard-coded here.
settlement-lag-days=0
settlement-account=7000
settlement-cash-account=1000
