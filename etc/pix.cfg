# Pix institutional configuration.
#
# Values here are institution-side operating settings.  Where a value is
# commonly believed to be fixed by Banco Central do Brasil rules (devolution
# window, MED deadlines, key limits, amount caps), it is NOT asserted here as
# regulatory truth.  It must be validated against the current authoritative
# sources before production use:
#   - Pix Regulation Book (Manual de Regras e Procedimentos do Pix), BCB
#   - SPI / DICT technical specifications, BCB
#   - QR Code Pix specification (EMVCo MPM based), BCB
# Keep behaviour driven by this file so the core is not structurally bound to
# one version of an external specification.

enabled=Y
rail=PIX
self-participant=P00000000001
base-currency=BRL
adapter=FIXTURE
# adapter=FIXTURE is a deterministic LOCAL test double for SPI/DICT answers.
# It is NOT a Banco Central integration. Set adapter=NONE to refuse any
# operation that requires the external boundary.
simulate=NONE
e2e-ispb=12345678
max-amount=9999999999999.99
keys-per-account=5
# Default dynamic QR charge expiration, in SECONDS, applied only when
# the caller omits the expiration.  86400 is the current Pix charging
# specification default (calendario expiration semantics: seconds, UTC
# instants).  When an expiration IS supplied it belongs to the charge and
# is authoritative; this value is never a blanket override.
qr-expiration-default-seconds=86400
devolution-window-days=7
med-window-days=11
# deployed SPI catalog contract version for the Split Tax message
# boundary (deployment/configuration only; never a business rule).
# spi.5.13.2.zip is the current published definition of the 5.13 cycle.
spi-message-version=5.13
stale-days=1
expire-days=1
# DICT claim / portability operating windows for the LOCAL DICT double.
# The BCB DICT API defines resolution and completion periods per claim type;
# their authoritative durations live in the Pix regulation / Manual de
# Tempos and change over time.  They are institution-side configuration
# here on purpose: the CORE implements the two-period LIFECYCLE SEMANTICS,
# not hard-coded regulatory durations.  Validate against current BCB
# material before any production use.
claim-resolution-days=2
claim-completion-days=3
# Settlement cycle operating settings.  The real SPI settlement schedule and
# participant obligations are external/regulatory; lag and account mapping are
# institution-side configuration so no Banco Central window is hard-coded here.
settlement-lag-days=0
settlement-account=7000
settlement-cash-account=1000
# --- GATE 3 production boundary (explicit environment, no real endpoints) ---
environment=LOCAL_DOUBLE
transport-adapter=LOCALDOUBLE
transport-timeout-secs=30
outbound-max-retry=3
security-adapter=LOCAL_DOUBLE
sign-algorithm=HASH-DOUBLE
signing-cert-ref=
trusted-issuer-subject=
boundary-clock-ref=SYSTEM
